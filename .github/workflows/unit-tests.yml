name: unit tests

on:
  push:
    branches:
      - master
jobs:
  perform-unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v7

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
           dotnet-version: '10.0.x'

      # Perform unit tests
      - name: Perform unit tests
        run: dotnet test --project WhoisClient.NET.Test -f net10.0 --output detailed
